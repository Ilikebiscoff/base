name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace > build.log 2>&1 || {
            ERR=$(grep -E "error:|What went wrong|Could not|FAILED|Caused by|^\s+> " build.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build failed::$ERR"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: basehunter-jar
          path: build/libs/basehunter-*.jar
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: build/libs/basehunter-1.0.0.jar
